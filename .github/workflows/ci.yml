name: syntax-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.0" "pytest>=8,<10"
      - run: python -m compileall -q analysis.py visualize.py
      - run: python -m pytest -q
